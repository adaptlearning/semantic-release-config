name: Release

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use
        type: string
        default: 'lts/*'

jobs:
  # Permissions are intentionally not declared here. A called workflow's job
  # cannot request more permissions than the caller grants, so any permission
  # listed here that a caller omits causes the run to fail at startup. Omitting
  # the block lets the job inherit the caller's permissions, which act as the
  # ceiling. See the README for the permissions each caller must grant.
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
